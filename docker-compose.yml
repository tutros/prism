services:
  backend:
    build:
      context: ./backend
      target: production
    env_file: .env
    environment:
      CORS_ORIGINS: ""
    volumes:
      # Named volume, not a bind mount: on a Linux host a bind-mounted ./backend/data keeps the
      # host owner's uid and the container's non-root appuser cannot write to it.
      - prism-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prism-data:
    name: prism-data   # fixed name, independent of the compose project name
